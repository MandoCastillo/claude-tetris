<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
  <div class="header">
    <h1 class="title">TETRIS</h1>
    <button id="theme-toggle" type="button" tabindex="-1" aria-pressed="false" aria-label="Cambiar a modo claro">☀ Claro</button>
  </div>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <div id="record-entry" hidden>
          <p class="record-msg">¡Nuevo récord! Entras en el top 5</p>
          <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button id="record-save" type="button">Guardar</button>
        </div>
        <div id="records">
          <span class="label">RECORDS</span>
          <ol id="records-list"></ol>
          <p id="records-extra"></p>
          <button id="records-reset" type="button">Borrar records</button>
        </div>
        <button id="restart-btn">Jugar</button>
      </div>
    </div>
  </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
